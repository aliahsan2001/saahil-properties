      '<h1 style="font:500 34px/1.15 Georgia,serif;margin:10px 0 14px">This site needs to run from a local server</h1>' +
      '<p>It uses modern JavaScript modules, which browsers block when a page is opened straight from a file.</p>' +
      '<p style="margin-top:14px">Run <code style="background:#1d1b19;padding:2px 6px;border-radius:4px">npm run dev</code>. Once deployed on Vercel it works normally.</p></div></div>';
  });
</script>
